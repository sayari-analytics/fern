name: java

on:
  pull_request:
    paths:
      - "generators/java/**"
    branches:
      - main
  workflow_call:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK
        uses: actions/setup-java@91d3aa4956ec4a53e477c4907347b5e3481be8c9 # v2
        with:
          distribution: "adopt"
          java-version: "11"

      - name: Build with Gradle
        working-directory: ./generators/java
        run: ./gradlew compileJava

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK
        uses: actions/setup-java@91d3aa4956ec4a53e477c4907347b5e3481be8c9 # v2
        with:
          distribution: "adopt"
          java-version: "11"

      - name: Build with Gradle
        working-directory: ./generators/java
        env:
          TERM: dumb
        run: ./gradlew test

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK
        uses: actions/setup-java@91d3aa4956ec4a53e477c4907347b5e3481be8c9 # v2
        with:
          distribution: "adopt"
          java-version: "11"

      - env:
          TERM: dumb
        name: Build with Gradle
        working-directory: ./generators/java
        run: ./gradlew check -x test
